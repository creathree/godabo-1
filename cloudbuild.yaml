# Cloud Build → Artifact Registry / GCR → Cloud Run
# 例: gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION=asia-northeast1

# PowerShell では --substitutions を必ずクォート（カンマ配列化を防ぐ）
# 例: --substitutions="_REGION=asia-northeast1,_SERVICE=godabo"
substitutions:
  _REGION: asia-northeast1
  _SERVICE: godabo

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=3
      # 実行時のみ（ビルドに埋め込まない）。SM に同名 secret を事前作成すること
      - --set-secrets=UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID