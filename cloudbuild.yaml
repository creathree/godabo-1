# Cloud Build → GCR → Cloud Run
# PowerShell: --substitutions="_REGION=asia-northeast1,_SERVICE=godabo"

substitutions:
  _REGION: asia-northeast1
  _SERVICE: godabo
  _NEXT_PUBLIC_NODE_ENV: production
  _NEXT_PUBLIC_SITE_URL: https://godabo-1.creathree.com
  _NEXT_PUBLIC_CREATHREE_URL: https://creathree.com
  _NEXT_PUBLIC_IMAJU_URL: https://imaju.creathree.com
  _NEXT_PUBLIC_CREATHREE_X_URL: https://x.com/creathree
  _NEXT_PUBLIC_GODABO_WSS_URL: wss://godabo-room.creasoundjapan.workers.dev

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --build-arg
      - NEXT_PUBLIC_NODE_ENV=${_NEXT_PUBLIC_NODE_ENV}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_CREATHREE_URL=${_NEXT_PUBLIC_CREATHREE_URL}
      - --build-arg
      - NEXT_PUBLIC_IMAJU_URL=${_NEXT_PUBLIC_IMAJU_URL}
      - --build-arg
      - NEXT_PUBLIC_CREATHREE_X_URL=${_NEXT_PUBLIC_CREATHREE_X_URL}
      - --build-arg
      - NEXT_PUBLIC_GODABO_WSS_URL=${_NEXT_PUBLIC_GODABO_WSS_URL}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=GODABO_ROOM_EPOCH=1
      - --set-secrets=UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest,GODABO_MASTER_ID=GODABO_MASTER_ID:latest,GODABO_ROOM_HMAC_SECRET=GODABO_ROOM_HMAC_SECRET:latest

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID